
{% load static %}

<!-- ================= BUYZO FOOTER ================= -->

<footer class="buyzo-footer">

    <style>
        .buyzo-footer {
            background: #E4D1AF;
            color: #122838;
            padding: 25px 0 15px;
            width: 100%;
        }

        .buyzo-footer * {
            box-sizing: border-box;
        }

        .buyzo-footer ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .buyzo-footer .footer-divider {
            border-top: 1px solid rgba(18, 40, 56, 0.2);
        }

        .buyzo-footer .payment-section {
            padding: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .buyzo-footer .payment-title {
            color: #122838;
            font-size: 14px;
            font-weight: 700;
        }

        .buyzo-footer .payment-icons {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .buyzo-footer .payment-icons img {
            max-width: 48px;
            height: 27px;
            object-fit: contain;
        }

        .buyzo-footer .footer-bottom {
            padding-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .buyzo-footer .copyright {
            color: #122838;
            font-size: 13px;
        }

        .buyzo-footer .copyright strong {
            color: #F28C28;
        }

        .buyzo-footer .social-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .buyzo-footer .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: 1px solid rgba(18, 40, 56, 0.35);
            border-radius: 6px;
            transition: all 0.25s ease;
        }

        .buyzo-footer .social-links a:hover {
            color: #F28C28;
            border-color: #F28C28;
            transform: translateY(-2px);
        }

        .buyzo-footer .social-links svg {
            width: 16px;
            height: 16px;
        }

        .buyzo-footer .follow-title {
            font-size: 14px;
            font-weight: 600;
            color: #122838;
        }

        @media (max-width: 600px) {
            .buyzo-footer {
                padding: 20px 0 15px;
            }

            .buyzo-footer .payment-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .buyzo-footer .footer-bottom {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>

    <div class="container">

        <!-- PAYMENT PARTNERS -->

        <div class="payment-section">

            <div class="flex flex-col sm:flex-row items-center gap-4">

                <div class="payment-title">
                    Payment Partners
                </div>

                <ul class="payment-icons">

                    <li>
                        <img src="{% static 'assets/images/payment/amazonpay.svg' %}"
                            alt="Amazon Pay">
                    </li>

                    <li>
                        <img src="{% static 'assets/images/payment/american-express.svg' %}"
                            alt="American Express">
                    </li>

                    <li>
                        <img src="{% static 'assets/images/payment/mastercard.svg' %}"
                            alt="Mastercard">
                    </li>

                    <li>
                        <img src="{% static 'assets/images/payment/paypal.svg' %}"
                            alt="PayPal">
                    </li>

                    <li>
                        <img src="{% static 'assets/images/payment/visa.svg' %}"
                            alt="Visa">
                    </li>

                </ul>

            </div>

            <div class="payment-title">
                Shop Smart. Shop with
                <strong style="color:#F28C28;">BUYZO.</strong>
            </div>

        </div>

        <!-- COPYRIGHT AND SOCIAL MEDIA -->

        <div class="footer-divider">

            <div class="footer-bottom">

                <!-- COPYRIGHT -->

                <div class="copyright">

                    © <span id="buyzo-copyright"></span>

                    <strong>BUYZO</strong>.
                    All Rights Reserved.

                    <div style="margin-top:5px;">
                        Everything You Need, All in One Place.
                    </div>

                </div>

                <!-- SOCIAL MEDIA -->

                <div class="flex items-center gap-4">

                    <span class="follow-title">
                        Follow BUYZO
                    </span>

                    <div class="social-links">

                        <!-- FACEBOOK -->

                        <a href="#!" aria-label="Facebook">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M7 10v4h3v7h4v-7h3l1-4h-4V8a1 1 0 0 1 1-1h3V3h-3a5 5 0 0 0-5 5v2H7"/>

                            </svg>

                        </a>

                        <!-- X -->

                        <a href="#!" aria-label="X">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M4 4l11.733 16h4.267L8.267 4z"/>
                                <path d="M4 20l6.768-6.768m2.46-2.46L20 4"/>

                            </svg>

                        </a>

                        <!-- INSTAGRAM -->

                        <a href="#!" aria-label="Instagram">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <rect x="3" y="3" width="18" height="18" rx="5"/>
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M17.5 6.5h.01"/>

                            </svg>

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</footer>

<!-- DYNAMIC COPYRIGHT YEAR -->

<script>
    document.getElementById("buyzo-copyright").textContent =
        new Date().getFullYear();
</script>
